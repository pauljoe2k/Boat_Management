databases:
  - name: harbour-desk-db
    databaseName: harbour_desk
    user: harbour
    plan: free
    region: oregon

services:
  # Backend API (Express + Prisma + PostgreSQL)
  - type: web
    name: harbour-desk-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: harbour-desk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'
      - key: UPLOAD_MAX_BYTES
        value: 5242880
      - key: REMINDER_POLL_MS
        value: 60000
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_PHONES
        value: '+919845011223'

  # Frontend (Vite + React)
  - type: static
    name: harbour-desk-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: harbour-desk-api
          property: host
          path: /api
      - key: VITE_USE_MOCK_API
        value: 'false'
