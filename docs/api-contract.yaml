openapi: 3.0.3
info:
  title: Harbour Desk API
  description: REST API for Harbour Desk vessel document compliance and automated reminders
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development backend
paths:
  /auth/otp/send:
    post:
      summary: Send OTP to phone number
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+91 98450 11223"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  devCode:
                    type: string
                    description: Only present in development mode
        '400':
          description: Invalid phone number
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many OTP requests
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/verify:
    post:
      summary: Verify OTP and login
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  example: "+91 98450 11223"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired code
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many verification attempts
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get currently authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Terminate session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /boats:
    get:
      summary: List all registered boats
      operationId: listBoats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of boats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Boat'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Register a new vessel
      operationId: createBoat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoatInput'
      responses:
        '201':
          description: Boat registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Boat'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicting resource
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /boats/{id}:
    get:
      summary: Get boat details with its documents
      operationId: getBoatById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Boat details with documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoatDetail'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Boat not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Partially update a vessel
      operationId: updateBoat
      x-extension: true
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                reg:
                  type: string
                owner:
                  type: string
                kind:
                  type: string
                icon:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: Updated boat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Boat'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Boat not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents:
    get:
      summary: List documents with optional filters
      operationId: listDocuments
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: boatId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, yes, no, due, over]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [days, boat, status]
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentItem'
        '400':
          description: Invalid query parameter
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Register a new boat document
      operationId: createDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [boatId, type, expiryDate]
              properties:
                boatId:
                  type: integer
                type:
                  type: string
                expiryDate:
                  type: string
                  format: date
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [boatId, type, expiryDate]
              properties:
                boatId:
                  type: integer
                type:
                  type: string
                expiryDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Document registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItem'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Boat not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicting resource
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Attachment exceeds the upload limit
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported attachment type
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents/{id}:
    get:
      summary: Get a single document
      operationId: getDocumentById
      x-extension: true
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItem'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a document's type and expiry date
      operationId: updateDocument
      x-extension: true
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                expiryDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItem'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents/{id}/file:
    get:
      summary: Download a document's attachment
      operationId: downloadDocumentFile
      x-extension: true
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Attachment bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document or attachment not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents/{id}/status:
    patch:
      summary: Toggle document submitted status
      operationId: updateDocumentStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submitted]
              properties:
                submitted:
                  type: boolean
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItem'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents/export-csv:
    get:
      summary: Export documents to CSV
      operationId: exportDocumentsCsv
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders:
    get:
      summary: Get reminder timeline
      operationId: listReminders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of upcoming and sent reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderItem'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders/test-push:
    post:
      summary: Send test push notification
      operationId: sendTestPush
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Test notification dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /settings:
    get:
      summary: Get reminder schedule and notification channel preferences
      operationId: getSettings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Settings data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update settings
      operationId: updateSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: Invalid payload
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/stats:
    get:
      summary: Compliance counters for the authenticated user's full document set
      operationId: getDashboardStats
      x-extension: true
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Counters derived from the unfiltered document set
          content:
            application/json:
              schema:
                type: object
                required: [total, submitted, notSubmitted, dueSoon, overdue]
                properties:
                  total:
                    type: integer
                  submitted:
                    type: integer
                  notSubmitted:
                    type: integer
                  dueSoon:
                    type: integer
                    description: Not submitted and expiring within 60 days (overdue included)
                  overdue:
                    type: integer
                    description: Not submitted and already expired
        '401':
          description: Unauthorized
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      summary: Liveness and database reachability
      operationId: getHealth
      x-extension: true
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Database unreachable
          x-extension: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      x-extension: true
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHORIZED,
                  NOT_FOUND,
                  CONFLICT,
                  PAYLOAD_TOO_LARGE,
                  UNSUPPORTED_MEDIA_TYPE,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                ]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        initials:
          type: string

    Boat:
      type: object
      required: [id, name, reg, owner, kind, icon, color]
      properties:
        id:
          type: integer
        name:
          type: string
        reg:
          type: string
        owner:
          type: string
        kind:
          type: string
        icon:
          type: string
        color:
          type: string
        ic:
          type: string
          x-extension: true
          description: Alias of `icon`, as used by the prototype and the shipped frontend
        c:
          type: string
          x-extension: true
          description: Alias of `color`, as used by the prototype and the shipped frontend
        documentCount:
          type: integer
        submittedCount:
          type: integer

    CreateBoatInput:
      type: object
      required: [name, reg, owner]
      properties:
        name:
          type: string
        reg:
          type: string
        owner:
          type: string
        kind:
          type: string
        icon:
          type: string
        ic:
          type: string
          x-extension: true
          description: Accepted alias of `icon`
        color:
          type: string
        c:
          type: string
          x-extension: true
          description: Accepted alias of `color`

    BoatDetail:
      allOf:
        - $ref: '#/components/schemas/Boat'
        - type: object
          properties:
            documents:
              type: array
              items:
                $ref: '#/components/schemas/DocumentItem'

    DocumentItem:
      type: object
      required: [id, boatId, type, expiryDate, daysLeft, submitted]
      properties:
        id:
          type: integer
        boatId:
          type: integer
        boat:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            reg:
              type: string
            owner:
              type: string
        type:
          type: string
        expiryDate:
          type: string
          format: date
        daysLeft:
          type: integer
        submitted:
          type: boolean
        fileName:
          type: string
          nullable: true

    ReminderItem:
      type: object
      required: [id, documentId, boatName, documentType, daysThreshold, expiryDate, triggerDate, sent]
      properties:
        id:
          type: string
        documentId:
          type: integer
        boatName:
          type: string
        documentType:
          type: string
        daysThreshold:
          type: integer
        expiryDate:
          type: string
        triggerDate:
          type: string
        sent:
          type: boolean
        deliveryStatus:
          type: string
          enum: [sent, scheduled]
          x-extension: true
          description: Dispatch state reported by the reminder worker

    Settings:
      type: object
      required: [schedule, channels]
      properties:
        schedule:
          type: object
          properties:
            '60':
              type: boolean
            '30':
              type: boolean
            '14':
              type: boolean
            '7':
              type: boolean
        channels:
          type: object
          properties:
            push:
              type: boolean
            email:
              type: boolean
            sms:
              type: boolean
