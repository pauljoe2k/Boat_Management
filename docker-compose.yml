services:
  postgres:
    image: postgres:16-alpine
    container_name: harbour-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: harbour
      POSTGRES_DB: harbour_desk
    ports:
      - "5432:5432"
    volumes:
      - harbour_desk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour -d harbour_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harbour_desk_pgdata:
